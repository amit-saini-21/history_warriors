{% extends "layout.html" %}
{% block body %}

<!-- Header Section -->
<header class="masthead" style="background-image: url('{{ url_for('static', filename='assets/img/about-bg.jpg') }}'); background-size: cover; background-position: center;">
    <div class="container position-relative px-4 px-lg-5 text-center">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="site-heading">
                    <h1 class="text-white fw-bold">Edit About Me</h1>
                    <span class="subheading text-light">A Blog That Tells the Story of Warriors</span>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Edit About Me Page -->
<main class="container px-4 px-lg-5 mt-4">
    
    <!-- Show All Paragraphs -->
    <h2 class="mb-3 text-center">Edit About Me Content</h2>
    <div class="table-responsive">
        <table class="table table-striped text-center">
            <thead class="table-dark">
                <tr>
                    <th>Para No</th>
                    <th>Content</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for para in paragraphs %}
                <tr>
                    <form method="POST" action="/dashboard/about" class="update-form">
                        <td>{{ para.para_no }}</td>
                        <td>
                            <textarea name="para" class="form-control">{{ para.para }}</textarea>
                            <input type="hidden" name="para_no" value="{{ para.para_no }}">
                        </td>
                        <td>
                            <button type="submit" class="btn btn-success">Update</button>
                            <a href="/delete_about/{{ para.para_no }}" class="btn btn-danger delete-btn">Delete</a>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Add New Paragraph -->
    <h3 class="mt-4 text-center">Add New Paragraph</h3>
    <form method="POST" action="/dashboard/about" class="add-form">
        <textarea name="para" id="newPara" placeholder="Enter New Paragraph" required class="form-control"></textarea>
        <button type="submit" class="btn btn-primary mt-2">Add Paragraph</button>
    </form>

</main>

<script>
    // Prevent empty paragraph submission
    document.querySelector(".add-form").addEventListener("submit", function (e) {
        let newPara = document.getElementById("newPara").value.trim();
        if (newPara === "") {
            alert("Paragraph cannot be empty!");
            e.preventDefault();
        }
    });

    // Confirm before deleting a paragraph
    document.querySelectorAll(".delete-btn").forEach(button => {
        button.addEventListener("click", function (e) {
            if (!confirm("Are you sure you want to delete this paragraph?")) {
                e.preventDefault();
            }
        });
    });
</script>

<style>
    /* Ensure form fields look clean */
    textarea {
        min-height: 80px;
        resize: vertical;
    }

    /* Responsive header height */
    @media (max-width: 768px) {
        .masthead {
            height: 250px;
        }
    }
</style>

{% endblock %}
