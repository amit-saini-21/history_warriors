{% extends "layout.html" %}
{% block body %}
    <!-- Page Header with Background Image -->
    {% set fname = "assets/img/" + post.img %}
    <header class="masthead" style="background-image: url('{{ url_for('static', filename=fname) }}'); background-size: cover; background-position: center;">
        <div class="container position-relative px-4 px-lg-5 text-center">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8 col-xl-7">
                    <div class="post-heading">
                        <h1 class="fw-bold text-white">{{ post.title }}</h1>
                        <span class="meta text-light">
                            Posted by Admin
                            <a href="/" class="text-warning">{{ params['head_uri'] }}</a>
                            on {{ post.date }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Blog Content Section with Scroll Animation -->
    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <article class="blog-content scroll-effect">
                    <div>{{ post.content | safe }}</div>
                </article>
                <a href="/contact">  <h3 style="color: red;">Note*:- If you have any issue contact me</h3></a>
            </div>
        </div>
    </section>

    <!-- Scroll Animation JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener("click", function (e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute("href")).scrollIntoView({
                        behavior: "smooth"
                    });
                });
            });
        
            const elements = document.querySelectorAll(".scroll-effect");
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("fade-in");
                    }
                });
            }, { threshold: 0.1 });
        
            elements.forEach(element => observer.observe(element));
        });
    </script>

    <style>
        .scroll-effect {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
{% endblock %}
